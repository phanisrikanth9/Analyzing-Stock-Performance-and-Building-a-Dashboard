name: Update dashboard

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, after the US market closes
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["dashboard.py", "template.html", "requirements.txt", ".github/workflows/update-dashboard.yml"]

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python dashboard.py
      - name: Commit the refreshed dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/latest_metrics.csv
          git diff --cached --quiet || git commit -m "Update dashboard data ($(date -u +%Y-%m-%d))"
          git push
