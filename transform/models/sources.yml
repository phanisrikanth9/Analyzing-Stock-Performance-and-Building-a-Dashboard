version: 2

sources:
  - name: raw
    description: Raw layer written by pipeline/ingest.py. Parquet files, one per ticker.
    tables:
      - name: prices
        description: Daily OHLCV, close adjusted for splits only, adj_close also for dividends.
        meta:
          external_location: "read_parquet('{{ env_var('RAW_DIR', '../warehouse/raw') }}/prices/*.parquet', union_by_name = true)"
        loaded_at_field: "cast(date as timestamp)"
        freshness:
          # Markets close on weekends and holidays, so allow a long weekend.
          warn_after: { count: 4, period: day }
          error_after: { count: 7, period: day }
      - name: revenue
        description: Quarterly total revenue in USD.
        meta:
          external_location: "read_parquet('{{ env_var('RAW_DIR', '../warehouse/raw') }}/revenue.parquet')"
